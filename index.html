<title>DIGERE Vacaciones</title>
<style>
*{margin:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:#2b2318;font-family:system-ui,-apple-system,sans-serif}
#splash{position:fixed;inset:0;background:#2b2318;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
#splash p{color:#c9a84c;font-size:13px;margin-top:12px;letter-spacing:1px;font-weight:500}
#splash .dots{margin-top:20px;display:flex;gap:5px}
#splash .dots i{width:7px;height:7px;border-radius:50%;background:#8B6914;opacity:.3;animation:p 1.2s ease-in-out infinite}
#splash .dots i:nth-child(2){animation-delay:.2s}
#splash .dots i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
iframe{width:100%;height:100%;border:0;position:fixed;inset:0}
.offline{position:fixed;inset:0;background:#2b2318;display:none;flex-direction:column;align-items:center;justify-content:center;color:#c9a84c;text-align:center;padding:20px}
.offline img{height:40px;margin-bottom:16px}
.offline h2{color:#f0e6d0;font-size:18px;margin-bottom:8px}
.offline p{font-size:13px;margin-bottom:20px;opacity:.7}
.offline button{background:#8B6914;color:#fff;border:0;padding:12px 24px;border-radius:10px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>

  <h2>Sin conexión</h2>
  <p>Necesitas conexión a internet para usar la aplicación.</p>
  <button onclick="location.reload()">Reintentar</button>
</div>

<!--
  ⚠️ IMPORTANTE: Sustituye la URL de abajo por la URL de tu webapp de Apps Script.
  Es la que empieza por https://script.google.com/macros/s/...../exec
-->
<iframe id="app" src="https://script.google.com/a/macros/sav.es/s/AKfycbygqpHv3yP5qL2DlHLbXaiD9j_l5MzcJ_qL3CVNbYVYjBSwZmeTQ1xGZZA8F76IpH9qsQ/exec" allow="clipboard-write" style="display:none"></iframe>

<script>
// Registrar Service Worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

// Gestionar carga del iframe
const iframe = document.getElementById('app');
const splash = document.getElementById('splash');
const offline = document.getElementById('offline');

function showApp(){
  iframe.style.display = 'block';
  splash.classList.add('hide');
  setTimeout(() => splash.style.display = 'none', 600);
}

iframe.addEventListener('load', showApp);

// Timeout: si no carga en 15s, mostrar offline o la app (por si cargó parcialmente)
setTimeout(() => {
  if(splash.style.display !== 'none'){
    if(!navigator.onLine){
      splash.style.display = 'none';
      offline.style.display = 'flex';
    } else {
      showApp(); // Forzar mostrar aunque no haya disparado load
    }
  }
}, 15000);

// Detectar offline
window.addEventListener('offline', () => {
  if(iframe.style.display === 'none'){
    splash.style.display = 'none';
    offline.style.display = 'flex';
  }
});
window.addEventListener('online', () => {
  offline.style.display = 'none';
  location.reload();
});
</script>

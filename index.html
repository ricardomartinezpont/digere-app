<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#2b2318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vacaciones">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>DIGERE Vacaciones</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--pri:#8B6914;--pri2:#a67c1a;--pri3:#c9a84c;--priL:#f8f0d8;--dk:#2b2318;--dk2:#3d3328;--dk3:#4e4438;--txt:#1a1612;--txt2:#6b6152;--txt3:#9e9282;--bg:#faf8f5;--bg2:#f3efe8;--card:#fff;--ln:#e8e2d8;--ok:#2e7d32;--okb:#e8f5e9;--no:#c62828;--nob:#ffebee;--pe:#e65100;--peb:#fff3e0;--ca:#78909c;--cab:#eceff1;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;color:var(--txt);background:var(--bg);font-size:14px;line-height:1.5}

/* SPLASH + LOGIN */
#splash{position:fixed;inset:0;background:var(--dk);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}
#splash img{height:48px;margin-bottom:16px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
#splash .stxt{color:var(--pri3);font-size:14px;font-weight:500;letter-spacing:1px;margin-bottom:24px}
#splash .sdot{display:flex;gap:6px;margin-top:16px}
#splash .sdot i{width:8px;height:8px;border-radius:50%;background:var(--pri);opacity:.3;animation:pulse 1.2s ease-in-out infinite}
#splash .sdot i:nth-child(2){animation-delay:.2s}
#splash .sdot i:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(1)}50%{opacity:1;transform:scale(1.3)}}
#gsi-btn{margin-top:8px}
#splash .serr{color:#ef5350;font-size:12px;margin-top:12px;max-width:280px;text-align:center;display:none}

/* APP SHELL */
#app{display:none;height:100%;flex-direction:column}
#app.show{display:flex}
.hdr{background:linear-gradient(160deg,var(--dk),var(--dk2),var(--dk3));padding:14px 16px 10px;padding-top:calc(14px + env(safe-area-inset-top,0px));flex-shrink:0;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--pri),var(--pri3),var(--pri))}
.hdr-top{display:flex;align-items:center;gap:10px}
.hdr img{height:32px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))}
.hdr-u{flex:1;min-width:0}
.hdr-name{color:#f0e6d0;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-inst{color:#b0a48c;font-size:11px}
.hdr-role{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;padding:2px 10px;border-radius:16px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0}
.hdr-today{font-size:11px;color:#b0a48c;margin-top:8px;padding:6px 10px;background:rgba(255,255,255,.05);border-radius:8px}
.hdr-today b{color:var(--pri3)}
.main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:12px 12px calc(12px + 64px + var(--safe-b))}
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:var(--safe-b);z-index:100;box-shadow:0 -2px 12px rgba(0,0,0,.06)}
.bnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:0;background:transparent;color:var(--txt3);font:inherit;font-size:10px;font-weight:600;cursor:pointer;transition:.2s;position:relative;min-height:52px}
.bnav button.on{color:var(--pri)}
.bnav button.on::before{content:'';position:absolute;top:0;left:25%;right:25%;height:2.5px;background:var(--pri);border-radius:0 0 4px 4px}
.bnav .bi{font-size:22px;line-height:1}
.bnav .nbadge{position:absolute;top:4px;right:calc(50% - 18px);background:var(--no);color:#fff;font-size:9px;min-width:16px;height:16px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700}
.c{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.03);animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.c h2{margin:0 0 14px;font-size:15px;color:var(--dk2);display:flex;align-items:center;gap:6px}
.c h2 .ico{font-size:17px}.c h2 .lt{color:var(--txt3);font-weight:400;font-size:11px;margin-left:4px}
.sal{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sal .big{text-align:center;min-width:80px}.sal .big .n{font-size:46px;font-weight:900;color:var(--pri);line-height:1}.sal .big .n.red{color:var(--no)}.sal .big .l{font-size:11px;color:var(--txt3)}
.sal .det{flex:1;min-width:180px}
.bar{height:8px;background:var(--bg2);border-radius:6px;overflow:hidden;display:flex;margin:6px 0}.bar i{height:100%;transition:width .6s}.bar .bd{background:linear-gradient(90deg,var(--pri),var(--pri2))}.bar .bp{background:var(--pe)}
.leg{font-size:11px;color:var(--txt2);display:flex;gap:12px;flex-wrap:wrap}.leg b{color:var(--txt)}
.dt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
.pol{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px}
.pi{background:var(--bg2);border-radius:10px;padding:10px 6px;text-align:center;border:1px solid var(--ln)}.pi .v{font-size:18px;font-weight:800;color:var(--pri)}.pi .v.w{color:var(--pe)}.pi .t{font-size:10px;color:var(--txt3)}
label{display:block;font-size:12px;color:var(--txt2);margin:10px 0 3px;font-weight:600}
input,textarea,select{width:100%;padding:10px 12px;border:1.5px solid var(--ln);border-radius:10px;font:inherit;font-size:16px;background:var(--card);transition:.2s;color:var(--txt)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 3px rgba(139,105,20,.1)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>div{flex:1;min-width:130px}
.prev{font-size:12px;color:var(--txt2);margin:8px 0 0}.prev b{color:var(--pri)}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;padding:12px 24px;border-radius:12px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:.2s;box-shadow:0 3px 12px rgba(139,105,20,.2);width:100%;min-height:48px}.btn:disabled{opacity:.4}
.mn{border:0;border-radius:8px;padding:6px 14px;cursor:pointer;color:#fff;font:inherit;font-size:12px;font-weight:700;min-height:36px}.mn.ok{background:var(--ok)}.mn.no{background:var(--no)}.mn.gr{background:var(--bg2);color:var(--txt);border:1px solid var(--ln)}.mn.bl{background:var(--pri)}
table{width:100%;border-collapse:collapse;font-size:12px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--ln);vertical-align:middle}
th{color:var(--txt3);font-weight:700;font-size:10px;text-transform:uppercase;background:var(--bg2)}
.badge{padding:2px 8px;border-radius:16px;font-size:10px;font-weight:700}
.APROBADA{color:var(--ok);background:var(--okb)}.RECHAZADA{color:var(--no);background:var(--nob)}.PENDIENTE{color:var(--pe);background:var(--peb)}.CANCELADA{color:var(--ca);background:var(--cab)}
.msg{padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:12px;display:none;animation:fi .3s;font-weight:500}
.msg.err{background:var(--nob);color:var(--no);display:block;border-left:4px solid var(--no)}.msg.ok{background:var(--okb);color:var(--ok);display:block;border-left:4px solid var(--ok)}
.vc{color:var(--txt3);font-size:12px}.ld{text-align:center;color:var(--txt3);padding:24px}
.cnav{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.cnav .ml{font-weight:800;color:var(--dk2);min-width:150px;text-align:center;text-transform:capitalize;font-size:16px}
.cnav button{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:700;font-size:16px;min-height:40px;min-width:40px}
.gd{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.gd .dw{text-align:center;font-size:9px;color:var(--txt3);padding:4px 2px;font-weight:800;text-transform:uppercase}
.cd{min-height:64px;border:1.5px solid var(--ln);border-radius:10px;padding:4px;font-size:10px;background:var(--card)}
.cd.we{background:var(--bg2);border-color:transparent;opacity:.5}.cd.hoy{border-color:var(--pri);box-shadow:0 0 0 2px rgba(139,105,20,.15);background:var(--priL)}.cd.ji{background:#fffdf5;border-color:#f5e6a3}
.cd .dn{font-weight:800;color:var(--dk2);font-size:12px}.cd.hoy .dn{color:var(--pri)}
.cd .fp{margin-top:3px;line-height:1.4;display:flex;flex-wrap:wrap;gap:1px}.cd .fp span{display:inline-block;padding:1px 4px;border-radius:4px;color:#fff;font-size:8px;font-weight:700}
.cd .ok-txt{color:var(--ok);margin-top:3px;font-size:9px;opacity:.5}
.ley{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px;font-size:10px;color:var(--txt3);padding:8px 10px;background:var(--bg2);border-radius:8px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:middle;margin-right:3px}
.mbar{height:5px;background:var(--bg2);border-radius:3px;overflow:hidden}.mbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.fh{display:inline-block;background:var(--nob);color:var(--no);padding:1px 6px;border-radius:10px;font-size:9px;font-weight:700;margin-left:4px}
.sd{background:var(--bg2);border-radius:8px;padding:6px 8px;margin-top:4px;font-size:11px;display:flex;gap:4px;flex-wrap:wrap}
.st{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:700}.st.sg{background:var(--okb);color:var(--ok)}.st.sw{background:var(--peb);color:var(--pe)}
.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.fl select{width:auto;min-width:140px;font-size:14px}.fl label{margin:0;font-size:11px}
.sub{font-size:11px;color:var(--txt3)}
.act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.act input{width:100px;font-size:14px}
</style>
</head>

let _token=null,E=null,TAB='solicitar',CAL={a:0,m:0,i:''},COL={};

/* === GOOGLE SIGN-IN === */
window.addEventListener('load',initGSI);
function initGSI(){
  if(typeof google==='undefined'||!google.accounts){setTimeout(initGSI,200);return;}
  google.accounts.id.initialize({client_id:CLIENT_ID,callback:onSignIn,auto_select:true});
  google.accounts.id.renderButton(document.getElementById('gsi-btn'),{theme:'filled_black',size:'large',text:'signin_with',shape:'pill',width:280});
  google.accounts.id.prompt();
  // Check URL params for email actions
  const params=new URLSearchParams(location.search);
  if(params.get('accion'))sessionStorage.setItem('pendingAction',JSON.stringify({accion:params.get('accion'),id:params.get('id')}));
}
function onSignIn(resp){
  _token=resp.credential;
  document.getElementById('gsi-btn').style.display='none';
  document.getElementById('dots').style.display='flex';
  loadApp();
}
function reSignIn(){
  _token=null;
  document.getElementById('splash').classList.remove('hide');
  document.getElementById('splash').style.opacity='1';
  document.getElementById('app').classList.remove('show');
  document.getElementById('gsi-btn').style.display='block';
  document.getElementById('dots').style.display='none';
  google.accounts.id.prompt();
}

/* === API === */
function api(action,params){
  return new Promise(function(resolve,reject){
    var cbName='_cb'+Math.random().toString(36).substr(2,8);
    var timeout=setTimeout(function(){delete window[cbName];reject(new Error('Timeout de conexión.'));},30000);
    window[cbName]=function(data){
      clearTimeout(timeout);delete window[cbName];
      if(data.error==='TOKEN_EXPIRED'){reSignIn();reject(new Error('Sesión expirada.'));return;}
      if(data.error){reject(new Error(data.error));return;}
      resolve(data);
    };
    var payload=encodeURIComponent(JSON.stringify({action:action,token:_token,params:params||{}}));
    var s=document.createElement('script');
    s.src=API_URL+'?d='+payload+'&cb='+cbName;
    s.onerror=function(){clearTimeout(timeout);delete window[cbName];reject(new Error('Error de conexión.'));};
    document.head.appendChild(s);
    s.onload=function(){document.head.removeChild(s);};
  });
}

/* === LOAD APP === */
async function loadApp(){
  try{
    const e=await api('getEstadoInicial');
    paint(e);
    // Handle pending email action
    const pa=sessionStorage.getItem('pendingAction');
    if(pa){sessionStorage.removeItem('pendingAction');const a=JSON.parse(pa);
      if(a.accion&&a.id){TAB='validar';show(TAB);}}
  }catch(err){
    const se=document.getElementById('serr');
    se.textContent=err.message;se.style.display='block';
    document.getElementById('dots').style.display='none';
    document.getElementById('gsi-btn').style.display='block';
  }
}

/* === UTILS === */
function h(t){return String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function bg(e){return'<span class="badge '+h(e)+'">'+h(e)+'</span>';}
function v(id){const el=document.getElementById(id);return el?el.value:'';}
function ac(s){return s==='PENDIENTE'||s==='APROBADA';}
function ic(inst){return COL[inst]||COL[Object.keys(COL).find(k=>inst&&inst.toLowerCase().indexOf(k.toLowerCase())>=0)]||DC;}
function sn(name){const p=name.split(' ');return p[0]+' '+(p.length>1?p[p.length-1].charAt(0)+'.':'');}

/* === PAINT === */
function paint(e){
  E=e;E.eq=null;E.all=null;E.adm=null;COL=e.colores||{};
  document.getElementById('splash').classList.add('hide');
  document.getElementById('app').classList.add('show');
  if(!e.identificado){document.getElementById('hdr').innerHTML='';document.getElementById('tb').innerHTML='';
    document.getElementById('ct').innerHTML='<div class="c" style="text-align:center;padding:32px"><img src="'+LOGO+'" style="height:36px;margin-bottom:14px"><h2 style="color:var(--dk2)">Sin acceso</h2><p class="vc">La cuenta <b>'+h(e.email||'')+'</b> no está registrada.</p></div>';return;}
  if(!CAL.a){const d=new Date();CAL.a=d.getFullYear();CAL.m=d.getMonth()+1;}
  const u=e.usuario,rol=e.esAdmin?'Admin':(e.esJefe?'Jefe':'Técnico');
  const nf=(e.fueraHoy||[]).length;
  let hoy=nf?e.fueraHoy.map(x=>'<b>'+h(x.nombre)+'</b>').join(' · '):'';
  document.getElementById('hdr').innerHTML='<div class="hdr-top"><img src="'+LOGO+'" alt="DIGERE"><div class="hdr-u"><div class="hdr-name">'+h(u.nombre)+'</div><div class="hdr-inst">'+h(u.instalacion)+'</div></div><span class="hdr-role">'+rol+'</span></div>'+(nf?'<div class="hdr-today">🏖️ Hoy fuera: '+hoy+'</div>':'');
  tabs();show(TAB);
}
function tdef(){
  const t=[{id:'solicitar',ico:'📋',l:'Solicitar'},{id:'calendario',ico:'📅',l:'Calendario'}];
  if(E.esJefe){const n=(E.pendientes||[]).length;t.push({id:'validar',ico:'✅',l:'Validar',n:n});t.push({id:'equipo',ico:'👥',l:'Equipo'});}
  if(E.esAdmin)t.push({id:'admin',ico:'⚙️',l:'Admin'});return t;}
function tabs(){document.getElementById('tb').innerHTML=tdef().map(t=>'<button class="'+(TAB===t.id?'on':'')+'" data-tab="'+t.id+'"><span class="bi">'+t.ico+'</span>'+t.l+(t.n?'<span class="nbadge">'+t.n+'</span>':'')+'</button>').join('');}
function show(t){TAB=t;tabs();const c=document.getElementById('ct');
  if(t==='solicitar'){c.innerHTML=vSol();loadPol();}
  else if(t==='calendario'){c.innerHTML=vCal();loadCal();}
  else if(t==='validar')c.innerHTML=vVal();
  else if(t==='equipo')vEq(c);
  else if(t==='admin')vAdm(c);
  document.getElementById('main').scrollTop=0;}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-tab]');if(b)show(b.dataset.tab);b=ev.target.closest('[data-can]');if(b)can(b.dataset.can);b=ev.target.closest('[data-res]');if(b)res(b.dataset.res,b.dataset.dec);});

/* === SOLICITAR === */
function sbar(s){const t=s.derecho>0?s.derecho:Math.max(1,s.disfrutados+s.pendientes);const d=Math.min(100,Math.round(s.disfrutados/t*100)),p=Math.min(100-d,Math.round(s.pendientes/t*100));return'<div class="bar"><i class="bd" style="width:'+d+'%"></i><i class="bp" style="width:'+p+'%"></i></div><div class="leg"><span><span class="dt" style="background:var(--pri)"></span>Disfrutados <b>'+s.disfrutados+'</b></span><span><span class="dt" style="background:var(--pe)"></span>Pendientes <b>'+s.pendientes+'</b></span><span>Convenio <b>'+s.derecho+'</b></span></div>';}
function pI(val,meta,lbl,inv){return'<div class="pi"><div class="v '+(inv?(val<=meta?'':'w'):(val>=meta?'':'w'))+'">'+val+'/'+meta+'</div><div class="t">'+lbl+'</div></div>';}
function vSol(){const s=E.saldo||{derecho:0,disfrutados:0,pendientes:0,restante:0},neg=s.restante<0;
  const rows=(E.misSolicitudes&&E.misSolicitudes.length)?E.misSolicitudes.map(x=>'<tr><td>'+h(x.fechaInicio)+'<br>'+h(x.fechaFin)+'</td><td>'+x.diasLaborables+'</td><td>'+bg(x.estado)+'</td><td>'+(x.estado==='PENDIENTE'?'<button class="mn gr" data-can="'+h(x.id)+'">Cancelar</button>':'')+'</td></tr>').join(''):'<tr><td colspan="4" class="vc">Sin solicitudes aún.</td></tr>';
  return'<div class="c"><h2><span class="ico">🏖️</span> Tu saldo <span class="lt">· días laborables</span></h2><div class="sal"><div class="big"><div class="n'+(neg?' red':'')+'">'+s.restante+'</div><div class="l">disponibles</div></div><div class="det">'+sbar(s)+'</div></div></div><div class="c" id="pc" style="display:none"><h2><span class="ico">📊</span> Política</h2><div class="pol" id="pg"></div></div><div class="c"><h2><span class="ico">📝</span> Nueva solicitud</h2><div class="row"><div><label>Fecha inicio</label><input type="date" id="ini" onchange="pre()"></div><div><label>Fecha fin</label><input type="date" id="fin" onchange="pre()"></div></div><label>Motivo (opcional)</label><textarea id="mot" rows="2" placeholder="Ej: Vacaciones de verano"></textarea><p class="prev" id="pv"></p><button class="btn" id="bs" onclick="send()">Enviar solicitud</button></div><div class="c"><h2><span class="ico">📋</span> Mis solicitudes</h2><table><tr><th>Periodo</th><th>Días</th><th>Estado</th><th></th></tr>'+rows+'</table></div>';}
async function loadPol(){try{const r=await api('getResumenPolitica');const g=document.getElementById('pg'),c=document.getElementById('pc');if(!g||!c)return;c.style.display='block';g.innerHTML=pI(r.diasIntensiva,r.metaIntensiva,'Intensiva',0)+pI(r.diasNavidad,r.metaNavidad,'Navidad',1)+pI(r.periodosFueraInt,r.metaPeriodos,'Per. fuera',1)+'<div class="pi"><div class="v">'+r.totalDisfrutado+'/'+r.derecho+'</div><div class="t">Total</div></div>';}catch(e){}}
async function pre(){const a=v('ini'),b=v('fin'),p=document.getElementById('pv');if(!a||!b){p.innerHTML='';return;}p.innerHTML='Calculando…';try{const r=await api('previewSolicitud',{ini:a,fin:b});let t='<b>'+r.dias+'</b> días laborables';if(r.enIntensiva||r.enNavidad)t+=' ('+r.enIntensiva+' int.'+(r.enNavidad?', '+r.enNavidad+' nav.':'')+')';if(r.avisos&&r.avisos.length){t+='<div style="background:var(--peb);border-left:3px solid var(--pe);padding:8px 10px;margin-top:8px;border-radius:8px;font-size:12px"><b>⚠ Avisos:</b><ul style="margin:4px 0;padding-left:16px">';r.avisos.forEach(a=>{t+='<li>'+h(a.texto)+'</li>';});t+='</ul><span style="color:var(--pe)">Puedes enviarla igualmente.</span></div>';}p.innerHTML=t;}catch(e){p.innerHTML='';}}
async function send(){const b=document.getElementById('bs');b.disabled=true;try{const r=await api('crearSolicitud',{fechaInicio:v('ini'),fechaFin:v('fin'),motivo:v('mot')});let m='✅ Enviada ('+r.diasLaborables+' días).';if(r.avisos&&r.avisos.length)m+=' ⚠ '+r.avisos.length+' aviso(s).';fl('ok',m);loadApp();}catch(err){fl('err',err.message);b.disabled=false;}}
async function can(id){if(!confirm('¿Cancelar esta solicitud?'))return;try{await api('cancelarSolicitud',{id});fl('ok','Cancelada.');loadApp();}catch(err){fl('err',err.message);}}

/* === CALENDARIO === */
function vCal(){const opts='<option value="">Todas</option>'+(E.instalaciones||[]).map(i=>'<option value="'+h(i)+'"'+(CAL.i===i?' selected':'')+'>'+h(i)+'</option>').join('');return'<div class="c"><div class="cnav"><button onclick="mr(-1)">‹</button><span class="ml" id="ml"></span><button onclick="mr(1)">›</button><select id="fi" onchange="CAL.i=this.value;loadCal()" style="flex:1;max-width:220px">'+opts+'</select></div><div id="ca"><div class="ld">Cargando…</div></div><div class="ley"><span><i style="background:#fffdf5;border:1px solid #f5e6a3"></i>Intens.</span><span><i style="background:var(--bg2)"></i>No lab.</span><span><i style="border:2px solid var(--pri);background:var(--priL)"></i>Hoy</span>'+(E.instalaciones||[]).slice(0,4).map(i=>'<span><i style="background:'+ic(i)+'"></i>'+h(i.replace(/INSTALACIÓN 3 /g,'I3 ').replace(/UTE /g,''))+'</span>').join('')+'</div></div>';}
function mr(d){let m=CAL.m+d,a=CAL.a;if(m<1){m=12;a--;}if(m>12){m=1;a++;}CAL.m=m;CAL.a=a;loadCal();}
async function loadCal(){const l=document.getElementById('ml');if(l)l.textContent=MS[CAL.m-1]+' '+CAL.a;try{const data=await api('getCalendarioMes',{anio:CAL.a,mes:CAL.m,instalacion:CAL.i});rCal(data);}catch(err){const c=document.getElementById('ca');if(c)c.innerHTML='<div class="msg err">'+h(err.message)+'</div>';}}
function rCal(data){const c=document.getElementById('ca');if(!c)return;const hk=new Date().toISOString().slice(0,10);let o='<div class="gd">'+['L','M','X','J','V','S','D'].map(d=>'<div class="dw">'+d+'</div>').join('');const off=data.dias.length?data.dias[0].dow:0;for(let i=0;i<off;i++)o+='<div></div>';data.dias.forEach(d=>{const we=!d.laborable,hy=d.fecha===hk,ji=d.intensiva&&d.laborable;let cl='cd'+(we?' we':'')+(hy?' hoy':'')+(ji?' ji':'');let ct='<div class="dn">'+d.dia+'</div>';if(d.fuera.length){ct+='<div class="fp">'+d.fuera.slice(0,3).map(f=>'<span style="background:'+ic(f.instalacion)+'">'+h(sn(f.nombre))+'</span>').join('')+(d.fuera.length>3?'<span style="background:#888">+'+(d.fuera.length-3)+'</span>':'')+'</div>';}else if(d.laborable){ct+='<div class="ok-txt">'+(ji?'☀':'')+'</div>';}o+='<div class="'+cl+'">'+ct+'</div>';});c.innerHTML=o+'</div>';}

/* === VALIDAR === */
function vVal(){const p=E.pendientes||[];const rows=p.length?p.map(s=>'<tr><td><b>'+h(s.nombre)+'</b><br><span class="sub">'+h(s.instalacion)+'</span></td><td>'+h(s.fechaInicio)+' → '+h(s.fechaFin)+'<br><span class="sub">'+s.diasLaborables+'d · '+h(s.motivo||'—')+'</span><div class="sd" id="d_'+h(s.id)+'"><span class="sub">…</span></div></td><td><div class="act" style="flex-direction:column"><input id="c_'+h(s.id)+'" placeholder="Comentario" style="width:100%"><div style="display:flex;gap:4px"><button class="mn ok" data-res="'+h(s.id)+'" data-dec="APROBADA">✓</button><button class="mn no" data-res="'+h(s.id)+'" data-dec="RECHAZADA">✕</button></div></div></td></tr>').join(''):'<tr><td colspan="3" class="vc" style="text-align:center;padding:24px">🎉 Sin pendientes</td></tr>';setTimeout(()=>p.forEach(s=>ldDet(s.id)),100);return'<div class="c"><h2><span class="ico">✅</span> Pendientes <span class="lt">· '+p.length+'</span></h2><table><tr><th>Técnico</th><th>Periodo</th><th></th></tr>'+rows+'</table></div>';}
async function ldDet(id){try{const r=await api('getAvisosSolicitud',{id});const el=document.getElementById('d_'+id);if(!el)return;let o='';if(r.saldo)o+='<span class="st sg">'+r.saldo.restante+'d</span>';if(r.avisos&&r.avisos.length)r.avisos.forEach(a=>{o+='<span class="st sw">⚠ '+h(a.texto)+'</span>';});else o+='<span class="st sg">✓ OK</span>';el.innerHTML=o;}catch(e){}}
async function res(id,d){const cm=(document.getElementById('c_'+id)||{}).value||'';try{await api('resolverSolicitud',{id,decision:d,comentario:cm});fl('ok',d==='APROBADA'?'✅ Aprobada':'Rechazada');loadApp();}catch(err){fl('err',err.message);}}

/* === EQUIPO === */
async function vEq(c){c.innerHTML='<div class="c"><div class="ld">Cargando…</div></div>';try{E.eq=await api('getEquipo');rEq(c);}catch(err){c.innerHTML='<div class="c"><div class="msg err">'+h(err.message)+'</div></div>';}}
function rEq(c){const eq=E.eq||[],fuera=(E.fueraHoy||[]).map(x=>x.nombre.toLowerCase());const insts=[...new Set(eq.map(x=>x.instalacion))].sort();const flt='<div class="fl"><select id="fI" onchange="fEq()"><option value="">Todas</option>'+insts.map(i=>'<option value="'+h(i)+'">'+h(i)+'</option>').join('')+'</select></div>';const rows=eq.map(x=>{const t=x.derecho>0?x.derecho:Math.max(1,x.disfrutados);const w=Math.min(100,Math.round(x.disfrutados/t*100));const neg=x.restante<0,ef=fuera.indexOf(x.nombre.toLowerCase())>=0;return'<tr data-i="'+h(x.instalacion)+'"><td><span style="display:inline-block;width:3px;height:20px;border-radius:2px;background:'+ic(x.instalacion)+';margin-right:6px;vertical-align:middle"></span>'+h(x.nombre)+(ef?'<span class="fh">🏖️</span>':'')+'<br><span class="sub">'+h(x.instalacion)+'</span></td><td style="min-width:80px"><div class="mbar"><i style="width:'+w+'%"></i></div><span class="sub">'+x.disfrutados+'/'+x.derecho+'</span></td><td><b'+(neg?' style="color:var(--no)"':'')+'>'+x.restante+'</b></td><td>'+x.pendientes+'</td></tr>';}).join('');c.innerHTML='<div class="c"><h2><span class="ico">👥</span> Equipo <span class="lt">· '+eq.length+'</span></h2>'+flt+'<table id="te"><tr><th>Persona</th><th>Usado</th><th>Disp.</th><th>P.</th></tr>'+rows+'</table></div><div class="c"><h2><span class="ico">📋</span> Historial</h2><div class="fl"><select id="fE" onchange="ldAll()"><option value="">Todas</option><option value="PENDIENTE">Pendientes</option><option value="APROBADA">Aprobadas</option><option value="RECHAZADA">Rechazadas</option><option value="CANCELADA">Canceladas</option></select></div><div id="ab"><div class="ld">…</div></div></div>';ldAll();}
function fEq(){const x=v('fI').toLowerCase();document.querySelectorAll('#te tr[data-i]').forEach(tr=>{tr.style.display=(!x||tr.dataset.i.toLowerCase()===x)?'':'none';});}
async function ldAll(){try{E.all=await api('getTodasSolicitudes',{estado:v('fE')});rAll();}catch(err){const b=document.getElementById('ab');if(b)b.innerHTML='<div class="msg err">'+h(err.message)+'</div>';}}
function rAll(){const b=document.getElementById('ab');if(!b)return;const l=E.all||[];b.innerHTML='<table><tr><th>Técnico</th><th>Periodo</th><th>Días</th><th>Estado</th><th></th></tr>'+(l.length?l.map(s=>'<tr><td>'+h(s.nombre)+'</td><td>'+h(s.fechaInicio)+'<br>'+h(s.fechaFin)+'</td><td>'+s.diasLaborables+'</td><td>'+bg(s.estado)+'</td><td>'+(ac(s.estado)?'<button class="mn gr" data-can="'+h(s.id)+'">✕</button>':'')+'</td></tr>').join(''):'<tr><td colspan="5" class="vc">Sin datos.</td></tr>')+'</table>';}

/* === ADMIN === */
async function vAdm(c){c.innerHTML='<div class="c"><div class="ld">Cargando…</div></div>';try{E.adm=await api('getAdminData');rAdm(c);}catch(err){c.innerHTML='<div class="c"><div class="msg err">'+h(err.message)+'</div></div>';}}
function rAdm(c){const d=E.adm,insts=d.instalaciones||[];const oi=insts.map(i=>'<option value="'+h(i)+'">'+h(i)+'</option>').join('');const ro=['TECNICO','JEFE','ADMIN'];const fe=d.empleados.map((x,i)=>{const r=ro.map(r=>'<option value="'+r+'"'+(x.rol===r?' selected':'')+'>'+r+'</option>').join('');return'<tr><td>'+h(x.nombre)+'<br><span class="sub">'+h(x.email)+'</span></td><td><input id="ed_'+i+'" type="number" min="0" value="'+x.derecho+'" style="width:50px;font-size:14px"></td><td><select id="er_'+i+'" style="width:85px;font-size:14px">'+r+'</select></td><td><button class="mn bl" onclick="sEmp('+i+')">💾</button></td></tr>';}).join('');const fr=d.reglas.map((r,i)=>'<tr><td>'+h(r.instalacion)+'</td><td><input id="rm_'+i+'" type="number" min="0" value="'+r.maxSimultaneos+'" style="width:50px;font-size:14px"></td><td><button class="mn bl" onclick="sReg('+i+')">💾</button></td></tr>').join('');c.innerHTML='<div class="c"><h2><span class="ico">➕</span> Alta trabajador</h2><div class="row"><div><label>Nombre</label><input id="aN" placeholder="Juan García López"></div><div><label>Email</label><input id="aE" placeholder="jgarcia@sfs..."></div></div><div class="row"><div><label>Instalación</label><select id="aI">'+oi+'<option value="__n">➕ Nueva…</option></select><input id="aIN" placeholder="Nueva instalación" style="display:none;margin-top:6px"></div><div><label>Días</label><input type="number" id="aD" min="0" value="21"></div></div><button class="btn" id="bA" onclick="alta()">Dar de alta</button></div><div class="c"><h2><span class="ico">👥</span> Empleados</h2><table><tr><th>Persona</th><th>Días</th><th>Rol</th><th></th></tr>'+fe+'</table></div><div class="c"><h2><span class="ico">⚙️</span> Cobertura</h2><table><tr><th>Instalación</th><th>Máx.</th><th></th></tr>'+fr+'</table><div class="row" style="margin-top:8px"><div><label>Instalación</label><input id="rI" placeholder="(defecto)"></div><div><label>Máx.</label><input id="rM" type="number" min="0" value="2"></div></div><button class="btn" onclick="nReg()">Guardar regla</button></div>';}
async function alta(){let i=v('aI');if(i==='__n')i=v('aIN');const b=document.getElementById('bA');b.disabled=true;try{await api('altaEmpleado',{nombre:v('aN'),email:v('aE'),instalacion:i,diasDerecho:v('aD')});fl('ok','✅ Alta OK.');show('admin');}catch(err){fl('err',err.message);b.disabled=false;}}
async function sEmp(i){const x=E.adm.empleados[i];try{await api('actualizarEmpleado',{email:x.email,diasDerecho:v('ed_'+i),rol:v('er_'+i)});fl('ok','✅ OK.');show('admin');}catch(err){fl('err',err.message);}}
async function sReg(i){const r=E.adm.reglas[i];try{await api('guardarRegla',{instalacion:r.instalacion,max:v('rm_'+i)});fl('ok','✅ OK.');show('admin');}catch(err){fl('err',err.message);}}
async function nReg(){try{await api('guardarRegla',{instalacion:v('rI'),max:v('rM')});fl('ok','✅ Regla guardada.');show('admin');}catch(err){fl('err',err.message);}}

function fl(t,m){const f=document.getElementById('fl');if(!f)return;f.innerHTML='<div class="msg '+t+'">'+h(m)+'</div>';document.getElementById('main').scrollTop=0;}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-tab]');if(b)show(b.dataset.tab);b=ev.target.closest('[data-can]');if(b)can(b.dataset.can);b=ev.target.closest('[data-res]');if(b)res(b.dataset.res,b.dataset.dec);});
document.addEventListener('change',ev=>{if(ev.target&&ev.target.id==='aI'){const n=document.getElementById('aIN');if(n)n.style.display=ev.target.value==='__n'?'block':'none';}});


// Event delegation for dynamic buttons
document.addEventListener('click',function(ev){
  const b=ev.target.closest('[data-can]');if(b){can(b.dataset.can);return;}
  const r=ev.target.closest('[data-res]');if(r){res(r.dataset.res,r.dataset.dec);return;}
});
// Service Worker
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
</script>
</body>
</html>
